services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: purva
      POSTGRES_USER: purva
      POSTGRES_PASSWORD: purva_dev_password
    ports:
      - "5432:5432"
    volumes:
      - purva_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purva -d purva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - purva_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - purva_minio:/data

  gateway:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: .
    command: celery -A services.m6_platform.queue.celery_app.celery worker --loglevel=INFO
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A services.m6_platform.queue.celery_app.celery beat --loglevel=INFO
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  llm:
    build:
      context: ./infra/llm
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

volumes:
  purva_postgres:
  purva_redis:
  purva_minio:
