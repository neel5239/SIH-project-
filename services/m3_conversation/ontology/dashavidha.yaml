questions:

  # ============================================================
  # PRAKRITI
  # Scoring is NOT performed by M3.
  # M3 only collects the answers required by M5.
  # ============================================================

  - id: ayush.prakriti.dosha_tendency
    section: prakriti
    framework: ayush_prakriti
    text_en: "Which description best matches your usual body and activity pattern?"
    value_type: single_choice
    options:
      - key: vata
        label_en: "Light build, variable energy, quick and irregular activity"
        icon: "vata"
      - key: pitta
        label_en: "Medium build, strong appetite, focused and active"
        icon: "pitta"
      - key: kapha
        label_en: "Sturdy build, steady energy, calm and stable"
        icon: "kapha"
      - key: mixed
        label_en: "A combination of these patterns"
        icon: "mixed"
      - key: unsure
        label_en: "Not sure"
        icon: "unsure"
    ask_if: []
    priority: medium
    mandatory: false
    input_modes:
      - voice
      - touch

  # ============================================================
  # VIKRITI
  # ============================================================

  - id: ayush.vikriti.current_dosha_change
    section: vikriti
    framework: ayush
    text_en: "Compared with your usual state, have you noticed a recent change in your body or symptoms?"
    value_type: single_choice
    options:
      - key: yes
        label_en: "Yes"
        icon: "yes"
      - key: no
        label_en: "No"
        icon: "no"
      - key: unsure
        label_en: "Not sure"
        icon: "unsure"
    ask_if: []
    priority: medium
    mandatory: false
    input_modes:
      - voice
      - touch

  - id: ayush.vikriti.symptom_pattern
    section: vikriti
    framework: ayush
    text_en: "Please describe the main change or imbalance you have noticed."
    value_type: text
    options: []
    ask_if:
      - slot_exists: ayush.vikriti.current_dosha_change
    priority: medium
    mandatory: false
    input_modes:
      - voice
      - touch

